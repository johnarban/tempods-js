name: Build and Deploy

on:
  push:
    branches:
      - deploy
      - dev
      - testing

jobs:
  build:
    if: ${{ github.repository_owner == 'johnarban' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@
        with:
          node-version: '20'
      
      - name: Use Yarn 4
        run: |
          corepack enable
          yarn set version 4.5.3

      - name: Yarn install
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build
        env:
          VUE_APP_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          VUE_APP_CDS_API_KEY: ${{ secrets.CDS_API_KEY }}

      - name: Check for draft flag
        uses: sergeysova/jq-action@v2
        id: draft
        with:
          cmd: cat package.json | jq -r '.draft // false'

      - name: Checkout gh-pages
        uses: actions/checkout@v3
        with:
          ref: gh-pages
          path: gh-pages-dir
          fetch-depth: 1
        continue-on-error: true

      - name: Prepare deployment folder
        id: prepare
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Current branch: ${BRANCH}"
          
          # Ensure directory exists (in case checkout failed/branch didn't exist)
          mkdir -p gh-pages-dir
          cd gh-pages-dir
          
          # Remove git metadata so we treat this as a plain directory of files
          rm -rf .git

          if [[ "$BRANCH" == "deploy" ]]; then
            echo "Deploying to root. Keeping sub-apps."
            # Delete everything except dev and testing
            find . -maxdepth 1 -not -name 'dev' -not -name 'testing' -not -name 'testingfixed' -not -name '.' -exec rm -rf {} +
            # Copy new build files to root
            cp -a ../dist/. .
          elif [[ "$BRANCH" == "dev" ]]; then
            echo "Deploying to dev folder."
            rm -rf dev
            mkdir -p dev
            cp -a ../dist/. dev/
          elif [[ "$BRANCH" == "testing" ]]; then
            echo "Deploying to testing folder."
            rm -rf testingfixed
            mkdir -p testingfixed
            cp -a ../dist/. testingfixed/
          else
            echo "Unknown branch: $BRANCH" >&2
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        if: ${{ steps.draft.outputs.value }} == 'false'
        with:
          branch: gh-pages
          folder: gh-pages-dir
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          clean: true
